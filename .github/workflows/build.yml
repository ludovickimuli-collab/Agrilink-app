name: Build Agrilink APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the project
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Configure Android Gradle
      - name: Configure Android Gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Agrilink"
          include(":app")
          EOF

      # 5. Configure root Gradle
      - name: Configure root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      # 6. Show Android SDK information
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true

      # 7. Build installable DEBUG APK
      - name: Build Debug APK
        run: |
          gradle clean
          gradle assembleDebug --stacktrace

      # 8. Find the APK
      - name: Find APK
        run: |
          echo "Searching for APK..."
          find app/build/outputs -type f -name "*.apk" -print

      # 9. Upload APK
      - name: Upload Agrilink APK
        uses: actions/upload-artifact@v4
        with:
          name: Agrilink-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
